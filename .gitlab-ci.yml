stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "trunk"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
  RUSTUP_HOME: $CI_PROJECT_DIR/.cache/rustup
  npm_config_store_dir: $CI_PROJECT_DIR/.cache/pnpm-store
  ELECTRON_CACHE: $CI_PROJECT_DIR/.cache/electron-download
  ELECTRON_BUILDER_CACHE: $CI_PROJECT_DIR/.cache/electron-builder
  USE_SYSTEM_FPM: "true"
  ELECTRON_ARCH: x64
  BUILD_VERSION: 0.1.$CI_PIPELINE_IID

.desktop-linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update
    - >-
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      ca-certificates curl xz-utils git sudo build-essential python3 llvm
    - |
      node_dist=https://nodejs.org/dist/latest-v26.x
      node_file=$(curl -fsSL "$node_dist/SHASUMS256.txt" | awk '/linux-x64\.tar\.xz$/ {print $2}')
      curl -fsSL -o "/tmp/$node_file" "$node_dist/$node_file"
      (cd /tmp && curl -fsSL "$node_dist/SHASUMS256.txt" | grep " $node_file\$" | sha256sum -c -)
      tar -xJf "/tmp/$node_file" -C /usr/local --strip-components=1
      node --version
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1 --target wasm32-unknown-unknown
    - source "$CARGO_HOME/env"
    - cargo run --locked --quiet --manifest-path tools/ci/Cargo.toml -- build-desktop --step install_linux_deps
    - npm install --global pnpm@11.27.0
    - pnpm install --frozen-lockfile
  script:
    - whitelabel/desktop/build.sh "$CTX" --linux --x64
    - |
      for file in fluxer_desktop/dist-electron/*.{AppImage,deb,rpm,tar.gz}; do
        ls -lh "$file"
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/meine-$CTX-linux/$CI_PIPELINE_IID/$(basename "$file")"
      done

desktop:linux:pdl:
  extends: .desktop-linux
  variables:
    CTX: pdl

desktop:linux:ljs:
  extends: .desktop-linux
  variables:
    CTX: ljs

.desktop-windows:
  stage: build
  image: debian:trixie-slim
  timeout: 3h
  rules:
    - if: $HCLOUD_TOKEN && $WINDOWS_BUILD_SSH_KEY && $WINDOWS_BUILD_KNOWN_HOSTS
  variables:
    HCLOUD_VERSION: "1.70.2"
    HCLOUD_SHA256: b844bd28240112b0254183ba5266d0a0f59a6167c196636936459755efb88050
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl jq openssh-client >/dev/null
    - curl -fsSL -o /tmp/hcloud.tar.gz "https://github.com/hetznercloud/cli/releases/download/v$HCLOUD_VERSION/hcloud-linux-amd64.tar.gz"
    - echo "$HCLOUD_SHA256  /tmp/hcloud.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/hcloud.tar.gz -C /usr/local/bin hcloud
  script:
    - whitelabel/ci/windows-vm.sh up
    - whitelabel/ci/windows-vm.sh run 'New-Item -ItemType Directory -Force -Path C:\b | Out-Null'
    - whitelabel/ci/windows-vm.sh put whitelabel/desktop/build-windows.ps1 C:/b/build-windows.ps1
    - >-
      whitelabel/ci/windows-vm.sh run "powershell -NoProfile -ExecutionPolicy Bypass -File C:\\b\\build-windows.ps1
      -Context $CTX -Repository '$CI_REPOSITORY_URL' -Commit $CI_COMMIT_SHA -Version $BUILD_VERSION"
    - mkdir -p dist
    - whitelabel/ci/windows-vm.sh get 'C:/b/out/*' dist/
    - |
      for file in dist/*; do
        ls -lh "$file"
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/meine-$CTX-windows/$CI_PIPELINE_IID/$(basename "$file")"
      done
  after_script:
    - whitelabel/ci/windows-vm.sh down

desktop:windows:pdl:
  extends: .desktop-windows
  variables:
    CTX: pdl

desktop:windows:ljs:
  extends: .desktop-windows
  variables:
    CTX: ljs
