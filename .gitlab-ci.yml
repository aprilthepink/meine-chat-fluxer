stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "trunk"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
  RUSTUP_HOME: $CI_PROJECT_DIR/.cache/rustup
  npm_config_store_dir: $CI_PROJECT_DIR/.cache/pnpm-store
  ELECTRON_CACHE: $CI_PROJECT_DIR/.cache/electron-download
  ELECTRON_BUILDER_CACHE: $CI_PROJECT_DIR/.cache/electron-builder
  USE_SYSTEM_FPM: "true"
  ELECTRON_ARCH: x64
  BUILD_VERSION: 0.1.$CI_PIPELINE_IID

.desktop-linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update
    - >-
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      ca-certificates curl xz-utils git sudo build-essential python3 llvm
    - |
      node_dist=https://nodejs.org/dist/latest-v26.x
      node_file=$(curl -fsSL "$node_dist/SHASUMS256.txt" | awk '/linux-x64\.tar\.xz$/ {print $2}')
      curl -fsSL -o "/tmp/$node_file" "$node_dist/$node_file"
      (cd /tmp && curl -fsSL "$node_dist/SHASUMS256.txt" | grep " $node_file\$" | sha256sum -c -)
      tar -xJf "/tmp/$node_file" -C /usr/local --strip-components=1
      node --version
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1 --target wasm32-unknown-unknown
    - source "$CARGO_HOME/env"
    - cargo run --locked --quiet --manifest-path tools/ci/Cargo.toml -- build-desktop --step install_linux_deps
    - npm install --global pnpm@11.27.0
    - pnpm install --frozen-lockfile
  script:
    - whitelabel/desktop/build.sh "$CTX" --linux --x64
    - |
      for file in fluxer_desktop/dist-electron/*.{AppImage,deb,rpm,tar.gz}; do
        ls -lh "$file"
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/meine-$CTX-linux/$CI_PIPELINE_IID/$(basename "$file")"
      done

desktop:linux:pdl:
  extends: .desktop-linux
  variables:
    CTX: pdl

desktop:linux:ljs:
  extends: .desktop-linux
  variables:
    CTX: ljs
