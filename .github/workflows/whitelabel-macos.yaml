name: whitelabel macos

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whitelabel-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop macos ${{ matrix.ctx }}
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ctx:
          - pdl
          - ljs
    env:
      ELECTRON_ARCH: universal
      BUILD_VERSION: 0.1.${{ github.run_number }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown

      - name: Install LLVM (wasm32) and setuptools
        run: |
          brew install llvm python-setuptools
          llvm=$(brew --prefix llvm)
          echo "CC_wasm32_unknown_unknown=$llvm/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm/bin/llvm-ar" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: whitelabel/desktop/build.sh ${{ matrix.ctx }} --mac --universal -c.mac.sign.identity=-

      - name: Check signature
        run: |
          app=$(find fluxer_desktop/dist-electron -maxdepth 2 -name '*.app' -type d | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"
          lipo -archs "$app/Contents/MacOS/$(basename "$app" .app)"
          ls -lh fluxer_desktop/dist-electron/*.dmg fluxer_desktop/dist-electron/*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meine-${{ matrix.ctx }}-macos-${{ env.BUILD_VERSION }}
          path: |
            fluxer_desktop/dist-electron/*.dmg
            fluxer_desktop/dist-electron/*.zip
          compression-level: 0
          retention-days: 30
